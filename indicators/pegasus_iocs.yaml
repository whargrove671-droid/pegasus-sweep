# Pegasus-Sweep Indicator of Compromise (IOC) Oracle
#
# This file is the seeding/example indicator set. It contains a SMALL number of
# PUBLICLY DOCUMENTED example indicators with source attribution for each.
# It is deliberately NOT a complete, current threat feed.
#
# For a production scan you MUST refresh from authoritative sources:
#   * Amnesty International MVT indicators:  https://github.com/mvt-project/mvt/tree/main/mvt/ios/iocs
#   * Citizen Lab long-term surveillance reports (NSO Pegasus)
#   * Qualys / Lookout published Pegasus IoCs
#
# Structure
#   meta:        feed provenance
#   process:     executable names (any platform) indicative of infection
#   file_paths:  path globs / substrings known to contain Pegasus artifacts
#   c2_domains:  known C2 / command-and-control domains
#   c2_cidrs:    C2 network ranges (documented ranges only)
#   persistence: registry keys / autorun paths to audit
#   ios:         iOS forensic artifacts (SMS.db / MNT / backup clues)
#   android:     Android forensic artifacts (SQLite/db paths, logs)

meta:
  name: pegasus-sweep-seed-iocs
  version: 0.1.0
  provenance: "Seed set only. Publicly documented examples requiring post-scan validation."
  sources:
    - "https://github.com/mvt-project/mvt"
    - "https://citizenlab.ca"
    - "https://www.amnesty.org/en/latest/research/2019/10/the-pegasus-project"

# ---------------------------------------------------------------------------
# Processes. NOTE: process names alone are a WEAK signal. Likelihood is raised
# only when combined with network evidence to C2 infrastructure and/or hash match.
# ---------------------------------------------------------------------------
process:
  low_confidence_names:
    - "tangerine monitor"
    - "scout"
    - "Verivo"

# ---------------------------------------------------------------------------
# File paths. These correspond to artifacts found on INFECTED PHONES during
# forensic examination (Amnesty / Citizen Lab). On a HOST they are only relevant
# if a phone was connected / backed up to that host. Weak signal on their own.
# ---------------------------------------------------------------------------
file_paths:
  ios_cellsite_lookup_paths:
    - "rows/ws_mall.temporaryfees"
    - "rows/ws_mall.promotions"
  android_tracking_paths:
    - "expenses.db"
    - "tracker.db"
  generic_suspicious:
    - "google_app_measurement"

# ---------------------------------------------------------------------------
# C2 infrastructure. These are EXAMPLE indicators. Many real Pegasus C2
# domains are sinkholed / defunct; NSO rotates infrastructure constantly.
# Refresh before production use.
# ---------------------------------------------------------------------------
c2_domains:
  example_documented:
    - "cdn0.wirelessalwayson.com"     # public example, historical
    - "tracker.docker-cisco.com"      # public example, historical
c2_cidrs:
  example_documented:
    - "192.168.50.0/24"  # placeholder — replace with live feed CIDRs

# ---------------------------------------------------------------------------
# Persistence / autorun audit (HOST side). Windows registry keys & startup
# locations a forensic scanner re-checks. These are ATTACK-SURFACE checks,
# not Pegasus-specific: Pegasus is a mobile implant and does not normally
# persist on a Windows host.
# ---------------------------------------------------------------------------
persistence:
  windows_registry:
    - "HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
    - "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run"
    - "HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce"
  startup_dirs:
    - "AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup"
    - "AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\*"

# ---------------------------------------------------------------------------
# iOS forensic artifacts (checked when a phone backup / extracted filesystem is
# presented to the tool, e.g. via MVT `ios ... --output`).
# ---------------------------------------------------------------------------
ios:
  sqlite_databases_to_scan:
    - "SMS.db"                  # messages/texts (look for anomalous attachment hashes)
    - "messageAttachments"      # iMessage attachments table
  anomaly_regex:
    # JSON/DB rows referencing unexpected executable or installer archives
    - "(?i)\\.sh\\.pkg"
    - "(?i)application/x-shockwave"
  mnt_regex:
    # MNT (iOS 16 "Pegasus mitigation") / restore artifact strings
    - "SOS_"
    - "MSB_"

# ---------------------------------------------------------------------------
# Android forensic artifacts
# ---------------------------------------------------------------------------
android:
  sqlite_databases_to_scan:
    - "expenses.db"     # co-located tracker DB seen in Android implants
    - "tracker.db"
  log_paths:
    - "tracker.log"