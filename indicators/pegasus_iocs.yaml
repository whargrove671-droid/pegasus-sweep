# Comprehensive Spyware Indicator of Compromise (IOC) Oracle
#
# This file contains PUBLICLY DOCUMENTED indicators from multiple commercial
# spyware vendors. It is a SEED set — refresh from authoritative sources
# before production use.
#
# Sources:
#   * Amnesty International MVT: https://github.com/mvt-project/mvt
#   * Amnesty Security Lab: https://securitylab.amnesty.org
#   * Citizen Lab: https://citizenlab.ca
#   * The-NSO-Blacklist: https://github.com/0n1cOn3/The-NSO-Blacklist
#   * The-Candiru-Blocklist: https://github.com/0n1cOn3/The-Candiru-Blocklist
#   * The-Intellexa-Blocklist: https://github.com/0n1cOn3/The-Intellexa-Blocklist
#   * The-Paragon-Blacklist: https://github.com/0n1cOn3/The-Paragon-Blacklist
#   * Microsoft MSTIC: https://www.microsoft.com/security/blog
#   * Google TAG: https://blog.google/threat-analysis-group/
#
# Vendors covered:
#   NSO Group (Pegasus, Phantom, Chrysaor, Quadrant, Novalight, Circles)
#   Candiru / Saito Tech (DevilsTongue, Sourgum)
#   Intellexa / Cytrox (Predator)
#   Paragon Solutions (Graphite)
#   FinFisher / Gamma Group (FinSpy) — historical
#   Hacking Team / Memento Labs (RCS) — historical
#   Cyberbit, Sandvine, Dark Basin, Stealth Falcon — historical
#
# Structure
#   meta:        feed provenance and vendor info
#   process:     executable names indicative of infection
#   file_paths:  path globs / substrings known to contain spyware artifacts
#   c2_domains:  known C2 / command-and-control domains (5,168+)
#   c2_cidrs:    C2 network ranges
#   c2_ips:      Known C2 server IP addresses
#   persistence: registry keys / autorun paths to audit
#   ios:         iOS forensic artifacts (SMS.db / MNT / backup clues)
#   android:     Android forensic artifacts (SQLite/db paths, logs)
#   windows:     Windows-specific artifacts ( Pegasus Windows variant)

meta:
  name: comprehensive-spyware-iocs
  version: 2026.10.25
  updated: 2026-10-25
  provenance: "Seed set compiled from public sources. Requires refresh before production use."
  sources:
    - "https://github.com/mvt-project/mvt"
    - "https://github.com/0n1cOn3/The-NSO-Blacklist"
    - "https://github.com/0n1cOn3/The-Candiru-Blocklist"
    - "https://github.com/0n1cOn3/The-Intellexa-Blocklist"
    - "https://github.com/0n1cOn3/The-Paragon-Blacklist"
    - "https://citizenlab.ca"
    - "https://securitylab.amnesty.org"
  vendors:
    nso_group:
      products: ["Pegasus", "Phantom", "Chrysaor", "Quadrant", "Novalight", "Circles"]
      infection_vectors: ["Heaven", "Erised", "Eden", "Hummingbird", "iOS Covert", "Android Covert"]
    candiru:
      products: ["DevilsTongue", "Sourgum"]
      aka: ["Sand Cat", "Caramel Tsunami", "Saito Tech Ltd"]
    intellexa:
      products: ["Predator"]
      aka: ["Cytrox"]
    paragon:
      products: ["Graphite"]
      aka: ["Paragon Solutions"]
    historical:
      vendors: ["FinFisher", "Hacking Team", "Cyberbit", "Sandvine", "Dark Basin", "Stealth Falcon"]

