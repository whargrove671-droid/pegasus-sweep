# ---------------------------------------------------------------------------
# WINDOWS-SPECIFIC ARTIFACTS (Pegasus Windows variant)
# ---------------------------------------------------------------------------
windows:
  # Pegasus Windows variant indicators
  pegasus_windows_files:
    - "C:\\Windows\\Temp\\*.tmp"
    - "C:\\Windows\\Temp\\*.dat"
    - "AppData\\Local\\Temp\\*.tmp"
  
  # Security services that Pegasus disables
  security_services:
    - "WinDefend"
    - "Sense"
    - "WdNisSvc"
    - "SecurityHealthService"
    - "wscsvc"
  
  # Registry keys Pegasus modifies
  suspicious_registry_keys:
    - "HKLM\\SYSTEM\\CurrentControlSet\\Services\\WinDefend"
    - "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender"
  
  # Behavioral indicators
  behavioral_indicators:
    - "Security log cleared (event 1102)"
    - "Test signing mode enabled"
    - "Debug mode enabled"
    - "Unsigned drivers loaded"
    - "Defender exclusions added"

